<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting...</title>
  </head>
  <body>
    <p id="message">Redirecting...</p>
    <script>
      const message = document.getElementById("message");
      const target = new URLSearchParams(window.location.search).get("url");

      try {
        if (!target || !target.trim()) {
          throw new Error("Missing URL");
        }

        const value = target.trim();
        const normalizedTarget = value.startsWith("//")
          ? `https:${value}`
          : /^[a-z][a-z\d+.-]*:/i.test(value)
            ? value
            : `https://${value}`;
        const destination = new URL(normalizedTarget);

        if (destination.protocol !== "http:" && destination.protocol !== "https:") {
          throw new Error("Unsupported URL protocol");
        }

        window.location.replace(destination.href);
      } catch {
        message.textContent = "A valid URL is required. Use this page with ?url=https%3A%2F%2Fexample.com";
      }
    </script>
  </body>
</html>
